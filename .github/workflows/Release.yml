name: Release

on:
  push:
    tags:
      - '[0-9][0-9].[0-9][0-9].[0-9][0-9]'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: 'recursive'
      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'zulu'
          java-version: 17
          cache: gradle
      - name: Setup Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Retrieve version
        run: |
          APP_VER_NAME=$(grep '^appVerName=' gradle.properties | cut -d'=' -f2)
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_NAME}" != "${APP_VER_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match appVerName=${APP_VER_NAME} in gradle.properties"
            exit 1
          fi
          echo VERSION=${APP_VER_NAME} >> $GITHUB_ENV
      - name: Write key
        run: |
          if [ -n "${{ secrets.KEY_STORE }}" ]; then
            echo releaseStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
            echo releaseKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
            echo releaseKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
            echo releaseStoreFile='${{ github.workspace }}/key.jks' >> gradle.properties
            echo ${{ secrets.KEY_STORE }} | base64 --decode > key.jks
          else
            echo "::warning::KEY_STORE is not configured, the release APK will be signed with the debug key"
          fi
      - name: Run unit tests
        # HookTest 要靠审计 JAR，发布机不下载知乎 APK 时整类跳过；目标解析兼容性由每日巡检兜底。
        run: bash ./gradlew testDebugUnitTest
      - name: Build with Gradle
        run: bash ./gradlew -PappVerName=${{ env.VERSION }} assembleRelease
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/release/Zhiliao_${VERSION}.apk"
          ls -l "${APK}"
          if gh release view "${VERSION}" > /dev/null 2>&1; then
            gh release upload "${VERSION}" "${APK}" --clobber
          else
            gh release create "${VERSION}" "${APK}" \
              --title "${VERSION}" \
              --target "${GITHUB_SHA}" \
              --generate-notes
          fi
      # FinalizeArtifact occasionally dies with ECONNRESET after the bytes are uploaded.
      # Retry once with overwrite; the apk is already compressed, so skip another zip pass.
      - name: Upload built apk
        id: upload_apk
        continue-on-error: true
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Zhiliao_${{ env.VERSION }}
          path: app/build/outputs/apk/release/Zhiliao_${{ env.VERSION }}.apk
          if-no-files-found: error
          compression-level: 0
      - name: Upload built apk (retry)
        if: steps.upload_apk.outcome == 'failure'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Zhiliao_${{ env.VERSION }}
          path: app/build/outputs/apk/release/Zhiliao_${{ env.VERSION }}.apk
          if-no-files-found: error
          overwrite: true
          compression-level: 0
